name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Test composition geometry and local analysis
        run: node --test tests/*.test.mjs
      - name: Test AI request handling with mocks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check Python and JavaScript syntax
        run: |
          python3 -m py_compile server.py launch.py build_standalone.py
          node --check dist/app.js
          node --check dist/core.mjs
          node --check dist/aesthetics.mjs
          node --check dist/subject-analysis.mjs
          node --check dist/aesthetics-view.mjs
          bash -n 启动.command 启用AI.command
      - name: Verify offline version matches source
        run: |
          python3 build_standalone.py
          git diff --exit-code -- 留白-本地体验.html
